version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: test_postgres
    restart: always
    ports:
      - "5433:5432"  # Map port 5432 (Postgres) to 5433 on the host (to avoid conflicts)
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
    driver: local
